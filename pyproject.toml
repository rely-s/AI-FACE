[project]
name = "ai-face"
version = "0.1.0"
description = "AI-FACE: Facial Feature Acquisition & Quality Monitoring for Pediatric Distress Research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

[project.scripts]
ai-face = "ai_face.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["stressID"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
